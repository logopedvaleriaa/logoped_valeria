<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4 в ряд</title>
<style>
:root{
  --milk:#EFE8CA; --olive:#9EA76B; --choc:#5A3C2A; --taupe:#B9A89C;
  --terra:#B96545; --paper:#FAF7EC; --shadow:rgba(90,60,42,.16);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,Manrope,Arial,sans-serif;
  color:var(--choc);
  background:
    radial-gradient(circle at 12% 10%,rgba(255,255,255,.75),transparent 25%),
    linear-gradient(145deg,var(--paper),var(--milk));
  display:flex; justify-content:center; align-items:center; padding:20px;
}
.app{width:min(1180px,100%); display:grid; grid-template-columns:minmax(520px,1.2fr) minmax(300px,.8fr); gap:28px; align-items:center}
.card{background:rgba(255,255,255,.58); border:1px solid rgba(90,60,42,.12); border-radius:28px; box-shadow:0 18px 50px var(--shadow); padding:24px}
h1{margin:0 0 5px; font-size:clamp(28px,4vw,48px); letter-spacing:-1.5px}
.sub{margin:0 0 20px;color:#796456}
.board-wrap{position:relative; padding:14px; border-radius:26px; background:var(--choc); box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 12px 25px rgba(90,60,42,.2)}
.board{display:grid; grid-template-columns:repeat(7,1fr); gap:9px; aspect-ratio:7/6}
.cell{
  border:0; padding:0; border-radius:50%; background:var(--milk);
  box-shadow:inset 0 4px 8px rgba(90,60,42,.18);
  cursor:pointer; position:relative; overflow:hidden;
}
.cell::after{content:"";position:absolute;inset:7%;border-radius:50%;background:transparent;transition:.18s}
.cell.p1::after{background:var(--terra);box-shadow:inset 0 -5px 10px rgba(90,60,42,.16),inset 0 4px 8px rgba(255,255,255,.25)}
.cell.p2::after{background:var(--olive);box-shadow:inset 0 -5px 10px rgba(90,60,42,.16),inset 0 4px 8px rgba(255,255,255,.25)}
.cell.win::after{outline:5px solid white; outline-offset:-6px; filter:brightness(1.06)}
.cell.drop::after{animation:pop .28s ease-out}
@keyframes pop{0%{transform:translateY(-70px) scale(.8)}75%{transform:translateY(4px) scale(1.04)}100%{transform:none}}
.side{display:flex;flex-direction:column;gap:16px}
.status{font-size:22px;font-weight:750;padding:17px 18px;border-radius:18px;background:var(--milk)}
.turn-dot{display:inline-block;width:17px;height:17px;border-radius:50%;vertical-align:-2px;margin-right:8px}
.task{min-height:190px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:22px;border-radius:22px;background:#fff;border:1px solid rgba(90,60,42,.1)}
.task small{text-transform:uppercase;letter-spacing:1.6px;color:#927d6d;font-weight:700}
.word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,4vw,52px);margin:12px 0 5px}
.hint{font-size:14px;color:#8b7768;line-height:1.4}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.action{border:0;border-radius:15px;padding:14px 12px;font-weight:750;font-size:15px;cursor:pointer}
#newTask{background:var(--olive);color:white}
#reset{background:var(--choc);color:white}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{padding:13px;border-radius:15px;background:rgba(255,255,255,.55);text-align:center}
.score b{font-size:22px}
.rules{font-size:13px;line-height:1.5;color:#796456;margin:0}
@media(max-width:820px){
 body{align-items:flex-start;padding:12px}.app{grid-template-columns:1fr;gap:14px}.card{padding:16px;border-radius:22px}
 .board-wrap{padding:9px}.board{gap:6px}.side{gap:11px}.task{min-height:140px}
}
</style>
</head>
<body>
<main class="app">
  <section class="card">
    <h1>4 в ряд</h1>
    <p class="sub">Собери четыре фишки подряд и побеждай!</p>
    <div class="board-wrap"><div id="board" class="board" aria-label="Игровое поле 7 на 6"></div></div>
  </section>

  <aside class="card side">
    <div id="status" class="status"></div>
    <div class="controls">
      <button id="reset" class="action" style="grid-column:1/-1">Новая игра</button>
    </div>
    <div class="score">
      <div>Терракотовый<br><b id="s1">0</b></div>
      <div>Оливковый<br><b id="s2">0</b></div>
    </div>
    <p class="rules">Нажимай на любую клетку нужного столбца — фишка упадёт на самое нижнее свободное место. Побеждает тот, кто первым соберёт 4 фишки по горизонтали, вертикали или диагонали.</p>
  </aside>
</main>

<script>
const ROWS=6,COLS=7;
let grid,current=1,ended=false,scores=[0,0,0];
const board=document.getElementById("board"),status=document.getElementById("status");
function build(){
 board.innerHTML="";
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
   const b=document.createElement("button"); b.className="cell"; b.dataset.r=r;b.dataset.c=c;
   b.setAttribute("aria-label",`Столбец ${c+1}`); b.onclick=()=>play(c); board.appendChild(b);
 }
}
function reset(){
 grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));current=1;ended=false;build();paintStatus();
}
function play(c){
 if(ended)return;
 let r=ROWS-1; while(r>=0&&grid[r][c])r--; if(r<0)return;
 grid[r][c]=current;
 const el=cell(r,c); el.classList.add("p"+current,"drop");
 const line=winLine(r,c,current);
 if(line){
   line.forEach(([rr,cc])=>cell(rr,cc).classList.add("win"));
   ended=true;scores[current]++;document.getElementById("s"+current).textContent=scores[current];
   status.innerHTML=`🏆 Победа! <span class="turn-dot" style="background:${current===1?'var(--terra)':'var(--olive)'}"></span>`;
   return;
 }
 if(grid.every(row=>row.every(Boolean))){ended=true;status.textContent="Ничья — поле заполнено!";return}
 current=current===1?2:1;paintStatus();
}
function winLine(r,c,p){
 const dirs=[[0,1],[1,0],[1,1],[1,-1]];
 for(const [dr,dc] of dirs){
  let line=[[r,c]];
  for(const sign of [-1,1]){
   let rr=r+dr*sign,cc=c+dc*sign;
   while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===p){line.push([rr,cc]);rr+=dr*sign;cc+=dc*sign}
  }
  if(line.length>=4)return line;
 } return null;
}
function cell(r,c){return board.children[r*COLS+c]}
function paintStatus(){
 const name=current===1?"Терракотовый":"Оливковый", color=current===1?"var(--terra)":"var(--olive)";
 status.innerHTML=`<span class="turn-dot" style="background:${color}"></span>Ход: ${name}`;
}
document.getElementById("reset").onclick=reset;
reset();
</script>
</body>
</html>
